name: Installer

on:
  push:
    paths:
      - "installer/**"
      - "mise.toml"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "installer/**"
      - "mise.toml"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Installer tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Check Zig version
        run: mise exec -- zig version

      - name: Format check
        working-directory: installer
        run: mise exec -- zig fmt --check src build.zig build.zig.zon

      - name: Unit tests
        working-directory: installer
        run: mise exec -- zig build test --summary all

      - name: Download integration
        working-directory: installer
        run: bash tests/https_integration.sh

  cross-build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-windows-gnu
          - aarch64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cross-build installer
        working-directory: installer
        run: mise exec -- zig build -Dtarget=${{ matrix.target }} --summary all
