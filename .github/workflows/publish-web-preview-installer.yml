name: Publish preview installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-linux-gnu
            source: library-setup
            output: library-setup-linux-x86_64
            package: linux
          - name: Windows x86_64
            target: x86_64-windows-gnu
            source: library-setup.exe
            output: library-setup-windows-x86_64.exe
            package: windows
          - name: macOS x86_64
            target: x86_64-macos
            source: library-setup
            output: library-setup-macos-x86_64
            package: macos-x86_64
          - name: macOS Apple Silicon
            target: aarch64-macos
            source: library-setup
            output: library-setup-macos-aarch64
            package: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Build small installer
        working-directory: installer
        run: mise exec -- zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall --summary all

      - name: Stage installer
        run: |
          mkdir -p publish
          cp "installer/zig-out/bin/${{ matrix.source }}" "publish/${{ matrix.output }}"
          chmod +x "publish/${{ matrix.output }}"
          (cd publish && sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256")

      - name: Package Finder and file-manager friendly setup
        env:
          PACKAGE_KIND: ${{ matrix.package }}
          RAW_INSTALLER: ${{ matrix.output }}
        run: |
          case "$PACKAGE_KIND" in
            linux)
              mkdir -p "$RUNNER_TEMP/library-setup-linux" "$RUNNER_TEMP/library-web-preview-setup"
              cp "publish/$RAW_INSTALLER" "$RUNNER_TEMP/library-setup-linux/.library-setup"
              cp "publish/$RAW_INSTALLER" "$RUNNER_TEMP/library-web-preview-setup/.library-setup"
              cp installer/package/linux/install-library "$RUNNER_TEMP/library-setup-linux/install-library"
              cp installer/package/linux/install-library-web-preview "$RUNNER_TEMP/library-web-preview-setup/install-library-web-preview"
              chmod +x "$RUNNER_TEMP/library-setup-linux/install-library" "$RUNNER_TEMP/library-setup-linux/.library-setup" "$RUNNER_TEMP/library-web-preview-setup/install-library-web-preview" "$RUNNER_TEMP/library-web-preview-setup/.library-setup"
              tar -C "$RUNNER_TEMP" -czf publish/library-setup-linux-x86_64.tar.gz library-setup-linux
              tar -C "$RUNNER_TEMP" -czf publish/library-web-setup-linux-x86_64.tar.gz library-web-preview-setup
              (cd publish && sha256sum library-setup-linux-x86_64.tar.gz > library-setup-linux-x86_64.tar.gz.sha256)
              (cd publish && sha256sum library-web-setup-linux-x86_64.tar.gz > library-web-setup-linux-x86_64.tar.gz.sha256)
              ;;
            macos-*)
              mkdir -p "$RUNNER_TEMP/Library Setup" "$RUNNER_TEMP/Library Web Preview Setup"
              cp installer/package/macos/Install\ Library.command "$RUNNER_TEMP/Library Setup/Install Library.command"
              cp installer/package/macos/Install\ Library\ Web\ Preview.command "$RUNNER_TEMP/Library Web Preview Setup/Install Library Web Preview.command"
              cp "publish/$RAW_INSTALLER" "$RUNNER_TEMP/Library Setup/.library-setup"
              cp "publish/$RAW_INSTALLER" "$RUNNER_TEMP/Library Web Preview Setup/.library-setup"
              chmod +x "$RUNNER_TEMP/Library Setup/Install Library.command" "$RUNNER_TEMP/Library Setup/.library-setup" "$RUNNER_TEMP/Library Web Preview Setup/Install Library Web Preview.command" "$RUNNER_TEMP/Library Web Preview Setup/.library-setup"
              (cd "$RUNNER_TEMP" && zip -Xqr "$GITHUB_WORKSPACE/publish/library-setup-$PACKAGE_KIND.zip" "Library Setup")
              (cd "$RUNNER_TEMP" && zip -Xqr "$GITHUB_WORKSPACE/publish/library-web-setup-$PACKAGE_KIND.zip" "Library Web Preview Setup")
              (cd publish && sha256sum "library-setup-$PACKAGE_KIND.zip" > "library-setup-$PACKAGE_KIND.zip.sha256")
              (cd publish && sha256sum "library-web-setup-$PACKAGE_KIND.zip" > "library-web-setup-$PACKAGE_KIND.zip.sha256")
              ;;
            windows)
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: publish/*

  desktop-linux:
    name: Build Linux CEF desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install and build frontend
        working-directory: web/svelte
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Build Linux desktop bundle
        working-directory: deno
        run: deno task desktop
      - name: Package Linux desktop bundle
        run: |
          mkdir -p publish
          tar -C dist -czf publish/library-desktop-linux-x86_64.tar.gz app
          (cd publish && sha256sum library-desktop-linux-x86_64.tar.gz > library-desktop-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: publish/*

  desktop-windows:
    name: Build Windows CEF desktop bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install and build frontend
        working-directory: web/svelte
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Build Windows desktop bundle
        working-directory: deno
        shell: bash
        run: deno desktop --allow-all --include ../web/static --target x86_64-pc-windows-msvc --output ../dist/library-windows.exe src/main.ts
      - name: Package Windows desktop bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\Library" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\dist\library-windows.exe" "$env:RUNNER_TEMP\Library\Library.exe"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish" | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP\Library" -DestinationPath "$env:GITHUB_WORKSPACE\publish\library-desktop-windows-x86_64.zip" -Force
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\publish\library-desktop-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  library-desktop-windows-x86_64.zip" | Set-Content -Encoding ascii "$env:GITHUB_WORKSPACE\publish\library-desktop-windows-x86_64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: publish/*

  desktop-macos:
    name: Build macOS ${{ matrix.arch }} CEF desktop bundle
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install and build frontend
        working-directory: web/svelte
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Build macOS desktop bundle
        working-directory: deno
        run: deno desktop --allow-all --include ../web/static --target ${{ matrix.target }} --output ../dist/library-macos src/main.ts
      - name: Package macOS desktop bundle
        run: |
          mkdir -p publish
          ditto dist/library-macos.app "$RUNNER_TEMP/Library.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/Library.app" "publish/library-desktop-macos-${{ matrix.arch }}.zip"
          (cd publish && shasum -a 256 "library-desktop-macos-${{ matrix.arch }}.zip" > "library-desktop-macos-${{ matrix.arch }}.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: publish/*

  manifest:
    name: Sign preview manifest
    needs: [build, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: publish
          merge-multiple: true

      - name: Sign manifest with protected release key
        working-directory: installer
        env:
          LIBRARY_INSTALLER_SIGNING_SEED: ${{ secrets.LIBRARY_INSTALLER_SIGNING_SEED }}
        run: |
          test -n "$LIBRARY_INSTALLER_SIGNING_SEED"
          bash scripts/generate-preview-manifest.sh manifests/web-preview-0.1.1.json ../publish/library-preview-manifest.json "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.1-preview.1"
          mise exec -- zig build run -- sign-manifest ../publish/library-preview-manifest.json ../publish/library-web-preview-manifest.signed
          grep -q '^public_key=21dbc24320a3d009b8ab0a6854859d64c4a936b4033703cfe2edc105c95a682b$' ../publish/library-web-preview-manifest.signed
          (cd ../publish && sha256sum library-web-preview-manifest.signed > library-web-preview-manifest.signed.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: web-preview-manifest
          path: |
            publish/library-preview-manifest.json
            publish/library-web-preview-manifest.signed
            publish/library-web-preview-manifest.signed.sha256

  publish:
    name: Attach installers to preview release
    needs: [build, desktop-linux, desktop-windows, desktop-macos, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: publish
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: publish
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: web-preview-manifest
          path: publish

      - name: Upload verified installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.1-preview.1
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" publish/* --clobber --repo "$GITHUB_REPOSITORY"
