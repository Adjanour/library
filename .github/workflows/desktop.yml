name: Desktop builds

on:
  push:
    paths:
      - "deno/**"
      - "web/svelte/**"
      - "web/static/**"
      - "mise.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "deno/**"
      - "web/svelte/**"
      - "web/static/**"
      - "mise.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux CEF package and launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install frontend dependencies
        working-directory: web/svelte
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: web/svelte
        run: pnpm run build
      - name: Build Linux desktop binary
        working-directory: deno
        run: deno task desktop
      - name: Launch validation
        run: xvfb-run -a installer/scripts/validate-desktop-launch.sh dist/app/app
      - name: EPUB reader smoke validation
        run: xvfb-run -a installer/scripts/validate-desktop-epub.sh dist/app/app "$RUNNER_TEMP/library-smoke.db" "$RUNNER_TEMP/library-smoke.epub"
      - name: Archive Linux package
        run: tar -C dist -czf dist/library-linux.tar.gz app
      - uses: actions/upload-artifact@v4
        with:
          name: library-linux-build
          path: dist/library-linux.tar.gz

  windows:
    name: Windows CEF package build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install and build frontend
        working-directory: web/svelte
        run: pnpm install --frozen-lockfile; pnpm run build
      - name: Build Windows desktop binary
        working-directory: deno
        run: deno desktop --allow-all --include ../web/static --target x86_64-pc-windows-msvc --output ../dist/library-windows src/main.ts
      - uses: actions/upload-artifact@v4
        with:
          name: library-windows-build
          path: dist/**

  macos:
    name: macOS CEF package build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/svelte/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install and build frontend
        working-directory: web/svelte
        run: pnpm install --frozen-lockfile; pnpm run build
      - name: Build macOS desktop binary
        working-directory: deno
        run: deno desktop --allow-all --include ../web/static --target aarch64-apple-darwin --output ../dist/library-macos src/main.ts
      - uses: actions/upload-artifact@v4
        with:
          name: library-macos-build
          path: dist/**
